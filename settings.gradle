pluginManagement {
    includeBuild 'build-logic'
    repositories {
        gradlePluginPortal()
        maven {
            name = 'NeoForged'
            url = 'https://maven.neoforged.net/releases'
        }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'CCStudio'

include 'common'

file('platforms').listFiles()
        .findAll { new File(it, 'build.gradle').isFile() }
        .sort { it.name }
        .each { directory ->
            include directory.name
            project(":${directory.name}").projectDir = directory
        }
