name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check the tag matches mod_version
        run: |
          version="$(grep '^mod_version=' gradle.properties | cut -d= -f2)"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match mod_version $version in gradle.properties"
            exit 1
          fi

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: oven-sh/setup-bun@v2

      - uses: gradle/actions/setup-gradle@v6

      - name: Build every platform
        run: ./gradlew build

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" platforms/*/build/libs/*.jar --title "CC: Studio $GITHUB_REF_NAME" --generate-notes

      - name: Publish to Modrinth
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          MODRINTH_PROJECT: dL1sDnKD
          CC_TWEAKED_PROJECT: gu7yAYhd
        run: |
          version="${GITHUB_REF_NAME#v}"
          existing="$(curl --fail-with-body -sS "https://api.modrinth.com/v2/project/$MODRINTH_PROJECT/version" \
            -H "Authorization: $MODRINTH_TOKEN" \
            -H "User-Agent: $GITHUB_REPOSITORY" | jq -r '.[].version_number')"
          for platform in platforms/*/; do
            minecraft="$(grep '^minecraft_version=' "$platform/gradle.properties" | cut -d= -f2)"
            if grep -qxF "$version+$minecraft" <<< "$existing"; then
              echo "$version+$minecraft is already on Modrinth"
              continue
            fi
            jar="$(ls "$platform"build/libs/*.jar)"
            data="$(jq -n \
              --arg project "$MODRINTH_PROJECT" \
              --arg dependency "$CC_TWEAKED_PROJECT" \
              --arg number "$version+$minecraft" \
              --arg name "CC: Studio $version for $minecraft" \
              --arg minecraft "$minecraft" \
              --arg changelog "https://github.com/$GITHUB_REPOSITORY/releases/tag/$GITHUB_REF_NAME" \
              '{project_id: $project, version_number: $number, name: $name, changelog: $changelog,
                game_versions: [$minecraft], loaders: ["neoforge"], version_type: "release", featured: true,
                dependencies: [{project_id: $dependency, dependency_type: "required"}], file_parts: ["file"]}')"
            curl --fail-with-body -sS https://api.modrinth.com/v2/version \
              -H "Authorization: $MODRINTH_TOKEN" \
              -H "User-Agent: $GITHUB_REPOSITORY" \
              -F "data=$data" \
              -F "file=@$jar"
          done
