name: Bug report
description: "Something in CC: Studio doesn't work as expected"
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug! Please search the existing issues first.
        Security problems should be [reported privately](https://github.com/alessiodam/CCStudio/security/advisories/new) instead.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the problem and what you expected to happen instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run `code` on an advanced computer
        2. Open the link and approve the browser
        3. ...
    validations:
      required: true
  - type: input
    id: mod-version
    attributes:
      label: "CC: Studio version"
      placeholder: 1.0.0
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: "Minecraft, NeoForge and CC: Tweaked versions"
      placeholder: "Minecraft 1.21.1, NeoForge 21.1.250, CC: Tweaked 1.120.2"
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: Where does the mod run?
      options:
        - Singleplayer
        - Singleplayer opened to LAN
        - Dedicated server
    validations:
      required: true
  - type: dropdown
    id: access
    attributes:
      label: How do browsers reach the editor?
      options:
        - Default (localhost)
        - Plain HTTP on a server
        - Built-in Cloudflare Tunnel
        - Reverse proxy
        - Built-in HTTPS
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and operating system
      placeholder: Firefox on Windows 11
  - type: textarea
    id: server-log
    attributes:
      label: Server log
      description: Paste the relevant part of `logs/latest.log`, or a link to it on https://mclo.gs. Remove anything you don't want to share, such as IP addresses.
      render: text
  - type: textarea
    id: browser-console
    attributes:
      label: Browser console errors
      description: Open the developer tools (F12) and copy any errors from the Console tab.
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched the existing issues and this bug hasn't been reported yet.
          required: true
